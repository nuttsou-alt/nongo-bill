<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NongO Bill</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; color: #333; }
        .header { background: #1976D2; color: white; padding: 18px; text-align: center; font-size: 22px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.05); }
        input, select { width: 100%; padding: 12px; margin: 5px 0 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: #1976D2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }
        input[readonly] { background: #f8f9fa; color: #6c757d; border-color: #e9ecef; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #1976D2; color: white; }
        .btn-primary:hover { background: #1565C0; }
        .btn-success { background: #2E7D32; color: white; }
        .btn-success:hover { background: #1B5E20; }
        .btn-danger  { background: #C62828; color: white; }
        .btn-scan    { background: #6A1B9A; color: white; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #1976D2; color: white; padding: 10px; text-align: left; font-weight: 600; }
        td { padding: 10px; border-bottom: 1px solid #e9ecef; }
        tr:nth-child(even) { background: #f8f9fa; }
        #scanner-container { width: 100%; position: relative; border-radius: 12px; background: #000; overflow: hidden; display: none; margin-top: 12px; border: 2px solid #6A1B9A; }
        #qr-reader { width: 100% !important; border: none !important; }
        #qr-reader video { width: 100% !important; height: auto !important; object-fit: cover; }
        #qr-reader__scan_region { width: 100% !important; }
        .scanner-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .scanner-target-box { position: relative; width: 250px; height: 250px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
        .corner { position: absolute; width: 20px; height: 20px; border-color: #bb86fc; border-style: solid; border-width: 0; }
        .top-left     { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
        .top-right    { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 8px; }
        .bottom-left  { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 8px; }
        .bottom-right { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }
        .scan-laser { position: absolute; left: 5%; width: 90%; height: 3px; background: linear-gradient(to right, transparent, #00E676, transparent); box-shadow: 0 0 8px #00E676; animation: moveLaser 2.5s linear infinite; }
        @keyframes moveLaser { 0% { top: 5%; } 50% { top: 95%; } 100% { top: 5%; } }
        .scan-instruction { color: #fff; font-size: 13px; background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 20px; margin-top: 15px; font-weight: 500; }
        .scanner-tools { display: flex; gap: 10px; padding: 10px; background: #212121; border-top: 1px solid #333; }
        .label { font-size: 14px; font-weight: 600; color: #495057; margin-bottom: 5px; display: block; }
        .total-box { background: #E3F2FD; border-radius: 8px; padding: 12px; margin-top: 12px; border: 1px solid #BBDEFB; }
        .total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 15px; }
        .total-row.grand-total { font-size: 18px; font-weight: bold; color: #0D47A1; margin-top: 5px; border-top: 1px dashed #90CAF9; padding-top: 5px; }
        .badge { background: #1976D2; color: white; border-radius: 12px; padding: 2px 8px; font-size: 12px; font-weight: bold; }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .popup-overlay.show { display: flex; }
        .popup-box { background: white; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-title { font-size: 20px; font-weight: bold; color: #2E7D32; text-align: center; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .popup-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f3f5; font-size: 15px; }
        .popup-row:last-of-type { border-bottom: none; }
        .popup-label { color: #6c757d; }
        .popup-value { font-weight: bold; color: #212529; }
        .popup-btn { margin-top: 20px; background: #2E7D32; color: white; border: none; border-radius: 8px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        .notification-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: #323232; color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; font-size: 14px; opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: #2E7D32; border-left: 5px solid #1B5E20; }
        .toast-error { background: #C62828; border-left: 5px solid #B71C1C; }
        .toast-info { background: #1976D2; border-left: 5px solid #0D47A1; }
    </style>
</head>
<body>

<div class="header">
    <i class="fa-solid fa-cart-shopping"></i> NongO Bill
</div>

<div class="container">

    <div class="card">
        <label class="label" for="billNumber">เลขที่บิล</label>
        <input type="text" id="billNumber" placeholder="สร้างเลขที่บิลอัตโนมัติ...">
    </div>

    <div class="card">
        <label class="label" for="barcodeInput">บาร์โค้ดสินค้า</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="barcodeInput" placeholder="สแกนหรือพิมพ์บาร์โค้ด" style="margin:0;">
            <button class="btn-scan" style="width:auto; padding:0 20px; margin:0;" onclick="initAudio(); toggleScan()" id="btn-toggle-scan">
                <i class="fa-solid fa-camera"></i> สแกน
            </button>
        </div>

        <div id="scanner-container">
            <div id="qr-reader"></div>
            <div class="scanner-overlay">
                <div class="scanner-target-box">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                    <div class="scan-laser"></div>
                </div>
                <div class="scan-instruction">วางบาร์โค้ดตรงกลางกรอบ</div>
            </div>
            <div class="scanner-tools">
                <div style="flex:1;">
                    <select id="camera-select" style="margin:0; padding:8px; font-size:14px; background:#424242; color:white; border:1px solid #555;">
                        <option value="">ค้นหากล้อง...</option>
                    </select>
                </div>
                <button id="torch-btn" disabled style="width:auto; margin:0; padding:0 15px; font-size:14px; background:#424242; color:#aaa; border:1px solid #555; height:38px;" onclick="toggleTorch()">
                    <i class="fa-solid fa-lightbulb"></i> แฟลช: ปิด
                </button>
            </div>
        </div>

        <div class="label" style="margin-top:14px;">ชื่อสินค้า</div>
        <input type="text" id="productName" placeholder="พิมพ์เพื่อค้นหา..." oninput="searchProduct()">
        <div id="searchResults" style="display:none; border:1px solid #ddd; border-radius:8px; max-height:180px; overflow-y:auto; background:white; margin-bottom:12px;"></div>

        <div style="display:flex; gap:8px;">
            <div style="flex:1;">
                <label class="label">จำนวน</label>
                <input type="number" id="qty" placeholder="0" min="0" oninput="calcCostPerUnit()">
            </div>
            <div style="flex:1;">
                <label class="label">หน่วย</label>
                <input type="text" id="unit" placeholder="เช่น ชิ้น, ห่อ">
            </div>
        </div>

        <div style="display:flex; gap:8px;">
            <div style="flex:1;">
                <label class="label">ทุน/หน่วย (อ่านอย่างเดียว)</label>
                <input type="number" id="costPerUnit" placeholder="0.00" step="0.01" readonly>
            </div>
            <div style="flex:1;">
                <label class="label">ราคาขาย/หน่วย</label>
                <input type="number" id="sellPrice" placeholder="0.00" step="0.01">
            </div>
        </div>

        <label class="label">รวมทุน (แก้ไขได้)</label>
        <input type="number" id="totalCost" placeholder="0.00" step="0.01" oninput="calcCostPerUnit()">

        <button class="btn-success" onclick="addItem()" style="margin-top:8px;">
            <i class="fa-solid fa-plus"></i> เพิ่มรายการสินค้าลงบิล
        </button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <b style="font-size:16px;">รายการสินค้าในบิล <span class="badge" id="itemCount">0</span></b>
            <button class="btn-danger" style="width:auto; padding:8px 14px; margin:0; font-size:13px;" onclick="clearItems()">
                <i class="fa-solid fa-trash"></i> ล้างบิล
            </button>
        </div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>สินค้า</th>
                        <th>จำนวน</th>
                        <th>ทุนรวม</th>
                        <th>ราคาขาย</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="itemBody"></tbody>
            </table>
        </div>
        <div class="total-box">
            <div class="total-row">
                <span>ต้นทุนรวม:</span>
                <span id="sumCost" style="font-weight:600; color:#c62828;">0.00</span>
            </div>
            <div class="total-row grand-total">
                <span>กำไรสุทธิโดยประมาณ:</span>
                <span id="sumProfit">0.00</span>
            </div>
        </div>
    </div>

    <button class="btn-primary" id="btn-save-sheet" onclick="saveToSheet()" style="padding:16px; font-size:18px; margin-top:10px;">
        <i class="fa-solid fa-floppy-disk"></i> บันทึกลง Google Sheet
    </button>

</div>

<div class="notification-container" id="toast-container"></div>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
        <div class="popup-title">
            <i class="fa-solid fa-circle-check" style="font-size:24px;"></i> บันทึกรายการสำเร็จ
        </div>
        <div class="popup-row"><span class="popup-label">ชื่อสินค้า</span><span class="popup-value" id="popProductName"></span></div>
        <div class="popup-row"><span class="popup-label">จำนวน</span><span class="popup-value" id="popQty"></span></div>
        <div class="popup-row"><span class="popup-label">หน่วย</span><span class="popup-value" id="popUnit"></span></div>
        <div class="popup-row"><span class="popup-label">ทุน/หน่วย</span><span class="popup-value" id="popCostPerUnit"></span></div>
        <div class="popup-row"><span class="popup-label">รวมทุน</span><span class="popup-value" id="popTotalCost"></span></div>
        <div class="popup-row"><span class="popup-label">ราคาขาย/หน่วย</span><span class="popup-value" id="popSellPrice"></span></div>
        <div class="popup-row" style="border-top:1.5px dashed #4caf50; margin-top:5px; padding-top:8px;">
            <span class="popup-label" style="color:#2E7D32; font-weight:bold;">กำไร</span>
            <span class="popup-value" id="popProfit" style="color:#2E7D32; font-size:16px;"></span>
        </div>
        <button class="popup-btn" onclick="closePopup()">เสร็จสิ้น</button>
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxJFlMC6F0v3oiVdj4ASV2pSWb9RHe6OesaiEjJZHBucbZmXB_U3Pb8F-2V5QAJlTe4AQ/exec";
let products = [];
let items = [];
let html5QrCode = null;
let audioCtx = null;
let activeCameraId = null;
let isTorchOn = false;

async function loadProducts() {
    try {
        const res = await fetch(API_URL + "?action=getProducts");
        products = await res.json();
        showToast("success", "โหลดสินค้าสำเร็จ " + products.length + " รายการ");
    } catch(e) {
        showToast("error", "ไม่สามารถโหลดข้อมูลสินค้าได้");
    }
}

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeep() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 2000;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.15);
    } catch(err) {}
}

function showToast(type, text) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.className = `toast toast-${type}`;
    let icon = '<i class="fa-solid fa-info-circle"></i>';
    if (type === 'success') icon = '<i class="fa-solid fa-circle-check"></i>';
    if (type === 'error')   icon = '<i class="fa-solid fa-triangle-exclamation"></i>';
    toast.innerHTML = `${icon} <span>${text}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 50);
    setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 4000);
}

function findByBarcode(barcode) {
    return products.find(p => String(p.Barcode) === String(barcode));
}

function searchProduct() {
    const keyword = document.getElementById("productName").value.toLowerCase();
    const div = document.getElementById("searchResults");
    if (keyword.length < 1) { div.style.display = "none"; return; }
    const filtered = products.filter(p => p.ProductName.toLowerCase().includes(keyword));
    if (filtered.length === 0) { div.style.display = "none"; return; }
    div.innerHTML = filtered.slice(0, 8).map(p =>
        `<div onclick="selectProduct('${p.ProductName.replace(/'/g, "\\'")}' )" style="padding:12px; cursor:pointer; border-bottom:1px solid #e9ecef; font-size:15px;">
            <i class="fa-solid fa-box" style="margin-right:8px; color:#1976D2;"></i> ${p.ProductName}
         </div>`
    ).join("");
    div.style.display = "block";
}

function selectProduct(name) {
    const p = products.find(x => x.ProductName === name);
    if (p) fillProduct(p);
    document.getElementById("searchResults").style.display = "none";
}

function fillProduct(p) {
    document.getElementById("productName").value = p.ProductName;
    document.getElementById("unit").value        = p.Unit;
    document.getElementById("costPerUnit").value = p.BaseCost;
    document.getElementById("sellPrice").value   = p.BasePrice;
    const qty = parseFloat(document.getElementById("qty").value) || 0;
    if (qty > 0) {
        document.getElementById("totalCost").value = (qty * p.BaseCost).toFixed(2);
    } else {
        document.getElementById("qty").value = 1;
        document.getElementById("totalCost").value = parseFloat(p.BaseCost).toFixed(2);
    }
}

document.getElementById("barcodeInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const barcode = this.value.trim();
        if (!barcode) return;
        const p = findByBarcode(barcode);
        if (p) {
            fillProduct(p);
            document.getElementById("qty").focus();
            showToast("info", "พบสินค้า: " + p.ProductName);
        } else {
            showToast("error", "ไม่พบสินค้านี้ กรุณากรอกรายละเอียด");
            document.getElementById("productName").focus();
        }
    }
});

function calcCostPerUnit() {
    const qty   = parseFloat(document.getElementById("qty").value) || 0;
    const total = parseFloat(document.getElementById("totalCost").value) || 0;
    if (qty > 0) {
        document.getElementById("costPerUnit").value = (total / qty).toFixed(2);
    } else {
        document.getElementById("costPerUnit").value = "";
    }
}

function addItem() {
    const billNo  = document.getElementById("billNumber").value.trim();
    const name    = document.getElementById("productName").value.trim();
    const qty     = parseFloat(document.getElementById("qty").value) || 0;
    const unit    = document.getElementById("unit").value.trim();
    const cost    = parseFloat(document.getElementById("costPerUnit").value) || 0;
    const sell    = parseFloat(document.getElementById("sellPrice").value) || 0;
    const total   = parseFloat(document.getElementById("totalCost").value) || 0;
    const barcode = document.getElementById("barcodeInput").value.trim();
    const profit  = (qty * sell) - total;

    if (!billNo) { showToast("error", "กรุณากรอกเลขที่บิลก่อน"); return; }
    if (!name)   { showToast("error", "กรุณากรอกชื่อสินค้า"); return; }
    if (qty <= 0){ showToast("error", "กรุณาระบุจำนวนให้มากกว่า 0"); return; }

    // ✅ อัปเดต Products Sheet ถ้ามี Barcode
    if (barcode !== "") {
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "updateProduct",
                ProductName: name,
                Barcode: barcode,
                Unit: unit,
                CostPerUnit: cost,
                SellPrice: sell
            })
        }).catch(err => console.warn("updateProduct failed:", err));
    }

    items.push({ BillNumber: billNo, Barcode: barcode, ProductName: name, Qty: qty, Unit: unit, CostPerUnit: cost, TotalCost: total, SellPrice: sell });
    renderItems();
    showPopup({ name, qty, unit, cost, total, sell, profit });
    clearForm();
    document.getElementById("barcodeInput").focus();
}

function showPopup(item) {
    document.getElementById("popProductName").textContent = item.name;
    document.getElementById("popQty").textContent         = item.qty;
    document.getElementById("popUnit").textContent        = item.unit;
    document.getElementById("popCostPerUnit").textContent = item.cost.toFixed(2);
    document.getElementById("popTotalCost").textContent   = item.total.toFixed(2);
    document.getElementById("popSellPrice").textContent   = item.sell.toFixed(2);
    document.getElementById("popProfit").textContent      = item.profit.toFixed(2) + " บาท";
    document.getElementById("popupOverlay").classList.add("show");
    setTimeout(closePopup, 2500);
}

function closePopup() {
    document.getElementById("popupOverlay").classList.remove("show");
}

function renderItems() {
    const tbody = document.getElementById("itemBody");
    tbody.innerHTML = items.map((item, i) => `
        <tr>
            <td style="font-weight:500;">${item.ProductName}</td>
            <td>${item.Qty} ${item.Unit}</td>
            <td style="font-weight:600;">${item.TotalCost.toFixed(2)}</td>
            <td>${item.SellPrice.toFixed(2)}</td>
            <td>
                <button onclick="removeItem(${i})" style="background:#C62828; color:white; border:none; border-radius:6px; padding:6px 12px; font-size:12px; width:auto; margin:0;">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </td>
        </tr>
    `).join("");
    document.getElementById("itemCount").textContent = items.length;
    const sumCost   = items.reduce((s, x) => s + x.TotalCost, 0);
    const sumProfit = items.reduce((s, x) => s + (x.Qty * x.SellPrice - x.TotalCost), 0);
    document.getElementById("sumCost").textContent   = sumCost.toFixed(2);
    document.getElementById("sumProfit").textContent = sumProfit.toFixed(2) + " บาท";
}

function removeItem(i) {
    items.splice(i, 1);
    renderItems();
    showToast("info", "ลบรายการเรียบร้อย");
}

function clearItems() {
    if (items.length === 0) return;
    if (confirm("ต้องการล้างรายการทั้งหมดใช่ไหม?")) {
        items = [];
        renderItems();
        showToast("info", "ล้างบิลเสร็จสิ้น");
    }
}

function clearForm() {
    document.getElementById("barcodeInput").value = "";
    document.getElementById("productName").value  = "";
    document.getElementById("qty").value          = "";
    document.getElementById("unit").value         = "";
    document.getElementById("costPerUnit").value  = "";
    document.getElementById("sellPrice").value    = "";
    document.getElementById("totalCost").value    = "";
}

async function saveToSheet() {
    if (items.length === 0) { showToast("error", "ไม่มีรายการ กรุณาเพิ่มสินค้าก่อน"); return; }
    const btn = document.getElementById("btn-save-sheet");
    btn.innerHTML = `<i class="fa-solid fa-spinner"></i> ⏳ กำลังบันทึก...`;
    btn.disabled = true;
    let success = 0;
    for (const item of items) {
        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveBillItem", ...item }) });
            success++;
        } catch(e) {}
    }
    btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> บันทึกลง Google Sheet`;
    btn.disabled = false;
    if (success === items.length) {
        showToast("success", `บันทึกสำเร็จ ${success} รายการ`);
        items = [];
        renderItems();
        generateAutoBillNumber();
    } else {
        showToast("error", `บันทึกสำเร็จ ${success}/${items.length} รายการ`);
    }
}

function generateAutoBillNumber() {
    const d = new Date();
    const day   = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year  = String(d.getFullYear()).slice(-2);
    document.getElementById("billNumber").value = `${day}${month}${year}001`;
}

async function toggleScan() {
    const container = document.getElementById("scanner-container");
    const scanBtn   = document.getElementById("btn-toggle-scan");
    if (html5QrCode && html5QrCode.isScanning) { await stopScan(); return; }
    initAudio();
    container.style.display = "block";
    scanBtn.innerHTML = `<i class="fa-solid fa-circle-stop"></i> ปิดกล้อง`;
    scanBtn.style.background = "#C62828";
    document.getElementById("qr-reader").innerHTML = "";
    try {
        html5QrCode = new Html5Qrcode("qr-reader");
        const devices = await Html5Qrcode.getCameras();
        setupCameraSelector(devices);
        const config = {
            fps: 22,
            qrbox: function(width, height) {
                const minSide = Math.min(width, height);
                return { width: Math.floor(minSide * 0.70), height: Math.floor(minSide * 0.70) };
            },
            aspectRatio: 1.0,
            experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        };
        await html5QrCode.start(activeCameraId || { facingMode: "environment" }, config, onScanSuccess, onScanError);
        await enforceContinuousAutofocus();
    } catch(err) {
        showToast("error", "ไม่สามารถเปิดกล้องได้: " + err);
        await stopScan();
    }
}

async function stopScan() {
    const container = document.getElementById("scanner-container");
    const scanBtn   = document.getElementById("btn-toggle-scan");
    if (html5QrCode) {
        try { if (isTorchOn) await toggleTorch(); await html5QrCode.stop(); } catch(e) {}
        html5QrCode = null;
    }
    container.style.display = "none";
    scanBtn.innerHTML = `<i class="fa-solid fa-camera"></i> สแกน`;
    scanBtn.style.background = "#6A1B9A";
    disableTorchUI();
}

function onScanSuccess(barcode) {
    playBeep();
    showToast("success", "สแกนสำเร็จ: " + barcode);
    document.getElementById("barcodeInput").value = barcode;
    stopScan();
    const p = findByBarcode(barcode);
    if (p) {
        fillProduct(p);
        document.getElementById("qty").focus();
    } else {
        showToast("info", "ไม่พบสินค้านี้ในระบบ กรุณากรอกชื่อสินค้า");
        document.getElementById("productName").value = "";
        document.getElementById("productName").focus();
    }
}

function onScanError(err) {}

function setupCameraSelector(devices) {
    const selector = document.getElementById("camera-select");
    selector.innerHTML = "";
    if (devices && devices.length > 0) {
        const sorted = devices.sort((a, b) => {
            const la = a.label.toLowerCase(); const lb = b.label.toLowerCase();
            if (la.includes("back") || la.includes("environment")) return -1;
            if (lb.includes("back") || lb.includes("environment")) return 1;
            return 0;
        });
        sorted.forEach((device, index) => {
            const option = document.createElement("option");
            option.value = device.id;
            option.textContent = device.label || `กล้อง ${index + 1}`;
            selector.appendChild(option);
        });
        if (!activeCameraId) activeCameraId = sorted[0].id;
        selector.value = activeCameraId;
        selector.onchange = async (e) => {
            activeCameraId = e.target.value;
            if (html5QrCode && html5QrCode.isScanning) { await stopScan(); await toggleScan(); }
        };
    } else {
        selector.innerHTML = `<option value="">ไม่พบกล้อง</option>`;
    }
}

async function enforceContinuousAutofocus() {
    setTimeout(async () => {
        try {
            if (!html5QrCode) return;
            const track = html5QrCode.getRunningTrack();
            if (!track) return;
            const capabilities = track.getCapabilities();
            const constraints = {};
            if (capabilities.focusMode) {
                if (capabilities.focusMode.includes("continuous")) constraints.focusMode = "continuous";
                else if (capabilities.focusMode.includes("macro")) constraints.focusMode = "macro";
            }
            if (Object.keys(constraints).length > 0) await track.applyConstraints({ advanced: [constraints] });
            const torchBtn = document.getElementById("torch-btn");
            if (capabilities.torch) {
                torchBtn.disabled = false;
                torchBtn.style.color = "#FFD54F";
                torchBtn.style.borderColor = "#FFD54F";
                torchBtn.innerHTML = isTorchOn ? `<i class="fa-solid fa-lightbulb"></i> แฟลช: เปิด` : `<i class="fa-solid fa-lightbulb"></i> แฟลช: ปิด`;
            } else { disableTorchUI(); }
        } catch(e) {}
    }, 1000);
}

async function toggleTorch() {
    if (!html5QrCode || !html5QrCode.isScanning) return;
    try {
        const track = html5QrCode.getRunningTrack();
        if (track && track.getCapabilities().torch) {
            isTorchOn = !isTorchOn;
            await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
            const torchBtn = document.getElementById("torch-btn");
            if (isTorchOn) {
                torchBtn.innerHTML = `<i class="fa-solid fa-lightbulb"></i> แฟลช: เปิด`;
                torchBtn.style.background = "#FFD54F"; torchBtn.style.color = "#212121";
            } else {
                torchBtn.innerHTML = `<i class="fa-solid fa-lightbulb"></i> แฟลช: ปิด`;
                torchBtn.style.background = "#424242"; torchBtn.style.color = "#FFD54F";
            }
        }
    } catch(err) {}
}

function disableTorchUI() {
    const torchBtn = document.getElementById("torch-btn");
    torchBtn.disabled = true;
    torchBtn.style.color = "#aaa"; torchBtn.style.background = "#424242"; torchBtn.style.borderColor = "#555";
    torchBtn.innerHTML = `<i class="fa-solid fa-lightbulb"></i> แฟลช: ไม่รองรับ`;
    isTorchOn = false;
}

loadProducts();
generateAutoBillNumber();
</script>
</body>
</html>
